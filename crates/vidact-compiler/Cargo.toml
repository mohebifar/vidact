[package]
name = "vidact-compiler"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "React-to-Vanilla compiler core for Vidact"

[lib]
name = "vidact_compiler"
path = "src/lib.rs"

[dependencies]
oxc_allocator = { path = "../../vendor/oxc/crates/oxc_allocator" }
oxc_ast = { path = "../../vendor/oxc/crates/oxc_ast" }
oxc_ast_visit = { path = "../../vendor/oxc/crates/oxc_ast_visit" }
oxc_codegen = { path = "../../vendor/oxc/crates/oxc_codegen", default-features = false, features = ["sourcemap"] }
oxc_diagnostics = { path = "../../vendor/oxc/crates/oxc_diagnostics" }
oxc_parser = { path = "../../vendor/oxc/crates/oxc_parser", features = ["regular_expression"] }
oxc_react_compiler = { path = "../../vendor/oxc/crates/oxc_react_compiler" }
oxc_semantic = { path = "../../vendor/oxc/crates/oxc_semantic" }
oxc_span = { path = "../../vendor/oxc/crates/oxc_span" }
oxc_sourcemap = "8.1.2"
oxc_syntax = { path = "../../vendor/oxc/crates/oxc_syntax" }
serde_json = "1.0.149"
