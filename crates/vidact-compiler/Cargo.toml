[package]
name = "vidact-compiler"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "React-to-Vanilla compiler core for Vidact"

[lib]
name = "vidact_compiler"
path = "src/lib.rs"

[dependencies]
oxc_allocator = "0.143.0"
oxc_ast = "0.143.0"
oxc_ast_visit = "0.143.0"
oxc_codegen = { version = "0.143.0", default-features = false }
oxc_parser = { version = "0.143.0", features = ["regular_expression"] }
oxc_react_compiler = { path = "../../vendor/oxc_react_compiler" }
oxc_semantic = "0.143.0"
oxc_span = "0.143.0"
oxc_syntax = "0.143.0"
serde_json = "1.0.149"
