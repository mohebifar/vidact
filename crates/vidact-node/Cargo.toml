[package]
name = "vidact-node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Node-API bindings for the Vidact compiler"

[lib]
crate-type = ["cdylib", "lib"]
test = false
doctest = false

[dependencies]
napi = { version = "3", features = ["serde-json"] }
napi-derive = "3"
serde_json = "1"
vidact-compiler = { path = "../vidact-compiler" }

[build-dependencies]
napi-build = "2"
