[workspace]
members = ["crates/*"]
exclude = ["vendor/oxc_react_compiler"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.metadata.vidact.react-compiler]
repository = "https://github.com/oxc-project/oxc"
crate-version = "0.143.0"
vendored-path = "vendor/oxc_react_compiler"
react-rust-pull-request = 36173

[profile.release]
codegen-units = 1
lto = "fat"
strip = true
