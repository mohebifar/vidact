name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Decide whether this commit is a release
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "releasing $GITHUB_REF_NAME"
            echo 'release=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pending_changesets="$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md | wc -l | tr -d ' ')"
          version="$(node --print "JSON.parse(require('node:fs').readFileSync('packages/compiler/package.json', 'utf8')).version")"
          tag="v$version"
          if [ "$pending_changesets" != 0 ]; then
            echo "$pending_changesets pending changeset(s): a version pull request is needed before $tag can be released"
            echo 'release=false' >> "$GITHUB_OUTPUT"
          elif [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              echo "$tag already exists: re-running the release for it"
              echo 'release=true' >> "$GITHUB_OUTPUT"
            else
              echo "$tag already exists: nothing to release"
              echo 'release=false' >> "$GITHUB_OUTPUT"
            fi
          else
            echo "no pending changesets and $tag does not exist yet: tagging and releasing"
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" --field ref="refs/tags/$tag" --field sha="$GITHUB_SHA"
            echo 'release=true' >> "$GITHUB_OUTPUT"
          fi

  native:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
        with:
          targets: ${{ matrix.target }}
      - name: Prepare patched Oxc checkout
        shell: bash
        run: scripts/prepare-oxc.sh
      - run: pnpm install --frozen-lockfile
      - name: Build native addon
        # glibc targets link against the `@napi-rs/cross-toolchain` sysroot (glibc 2.17) so the
        # addon loads on distributions older than the runner, which ships glibc 2.39.
        run: pnpm --filter @vidact/compiler exec napi build --manifest-path ../../crates/vidact-node/Cargo.toml --output-dir dist --platform --release --strip --esm --js binding.js --dts binding.d.ts --target ${{ matrix.target }} ${{ endsWith(matrix.target, '-linux-gnu') && '--use-napi-cross' || '' }}
      - name: Verify glibc baseline
        if: endsWith(matrix.target, '-linux-gnu')
        shell: bash
        run: bash scripts/check-glibc-baseline.sh 2.17 packages/compiler/dist/*.node
      - name: Test native addon
        run: pnpm --filter @vidact/compiler test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ matrix.target }}
          path: packages/compiler/dist/*.node
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: compiler-bindings
          path: |
            packages/compiler/dist/binding.d.ts
            packages/compiler/dist/binding.js
          if-no-files-found: error

  native-musl:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Prepare patched Oxc checkout
        shell: bash
        run: scripts/prepare-oxc.sh
      - name: Build and test native addon in Alpine
        shell: bash
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env TARGET='${{ matrix.target }}' \
            node:24-alpine \
            sh -euxc '
              apk add --no-cache bash build-base curl git perl python3
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.96.0 --target "$TARGET"
              npm install --global pnpm@10.19.0
              . "$HOME/.cargo/env"
              if [ "$TARGET" = aarch64-unknown-linux-musl ]; then
                export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=cc
              fi
              pnpm install --frozen-lockfile
              pnpm --filter @vidact/compiler exec napi build --manifest-path ../../crates/vidact-node/Cargo.toml --output-dir dist --platform --release --strip --esm --js binding.js --dts binding.d.ts --target "$TARGET"
              pnpm --filter @vidact/compiler test
            '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ matrix.target }}
          path: packages/compiler/dist/*.node
          if-no-files-found: error

  native-wasm:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
        with:
          targets: wasm32-wasip1-threads
      - name: Prepare patched Oxc checkout
        shell: bash
        run: scripts/prepare-oxc.sh
      - run: pnpm install --frozen-lockfile
      - name: Build WASI addon
        # The WASI loader is CommonJS, so napi refuses to derive its declaration from an ESM
        # `.d.ts` in a `"type": "module"` package; only this target needs the `.d.cts` name.
        run: pnpm --filter @vidact/compiler exec napi build --manifest-path ../../crates/vidact-node/Cargo.toml --output-dir dist --platform --release --esm --js binding.js --dts binding.d.cts --target wasm32-wasip1-threads
      - name: Test WASI addon
        # This job builds no native addon, so the loader reaches the WASI binding on its own and a
        # broken one fails the tests. `NAPI_RS_FORCE_WASI` would not work here: every napi-rs addon
        # in the process reads it, including the rolldown that vitest loads.
        run: pnpm --filter @vidact/compiler test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-wasm32-wasi
          path: |
            packages/compiler/dist/vidact-compiler.wasm32-wasi.wasm
            packages/compiler/dist/binding.js
            packages/compiler/dist/vidact-compiler.wasi.cjs
            packages/compiler/dist/vidact-compiler.wasi.d.cts
            packages/compiler/dist/vidact-compiler.wasi-browser.js
            packages/compiler/dist/wasi-worker.mjs
            packages/compiler/dist/wasi-worker-browser.mjs
          if-no-files-found: error

  assemble:
    needs: [native, native-musl, native-wasm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: compiler-bindings
          path: packages/compiler/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: native-*
          path: packages/compiler/artifacts
          merge-multiple: true
      - name: Assemble native packages and JavaScript packages
        run: |
          pnpm --filter @vidact/compiler build:js
          pnpm --filter @vidact/compiler exec napi create-npm-dirs --npm-dir npm
          pnpm --filter @vidact/compiler exec napi artifacts --output-dir artifacts --npm-dir npm
          test "$(find packages/compiler/npm -name '*.node' | wc -l | tr -d ' ')" = 7
          test "$(find packages/compiler/npm -name '*.wasm' | wc -l | tr -d ' ')" = 1
          pnpm --filter @vidact/compiler exec napi pre-publish --npm-dir npm --tag-style npm --no-gh-release --skip-optional-publish
          pnpm --filter @vidact/runtime build
          pnpm --filter @vidact/test-support build
          pnpm --filter @vidact/vite build
          pnpm --filter @vidact/start build
          pnpm --filter vidact build
      - name: Pack release
        shell: bash
        run: |
          mkdir -p release-tarballs
          for package_directory in packages/compiler/npm/*; do
            pnpm --dir "$package_directory" pack --pack-destination "$GITHUB_WORKSPACE/release-tarballs"
          done
          pnpm --filter @vidact/compiler pack --pack-destination release-tarballs
          pnpm --filter @vidact/runtime pack --pack-destination release-tarballs
          pnpm --filter @vidact/test-support pack --pack-destination release-tarballs
          pnpm --filter @vidact/react-types pack --pack-destination release-tarballs
          pnpm --filter @vidact/vite pack --pack-destination release-tarballs
          pnpm --filter @vidact/start pack --pack-destination release-tarballs
          pnpm --filter vidact pack --pack-destination release-tarballs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-tarballs
          path: release-tarballs/*.tgz
          if-no-files-found: error

  publish:
    needs: assemble
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require an OIDC-capable npm CLI
        shell: bash
        run: |
          npm_version="$(npm --version)"
          minimum_version='11.5.1'
          if [ "$(printf '%s\n%s\n' "$minimum_version" "$npm_version" | sort -V | head -n1)" != "$minimum_version" ]; then
            echo "npm $npm_version is older than required $minimum_version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-tarballs
          path: release-tarballs
      - name: Publish coordinated release
        env:
          NPM_CONFIG_PROVENANCE: true
        run: node scripts/publish-release-packages.mjs release-tarballs
